[project]
name = "ua-mbrl"
version = "0.2.0"
description = "Uncertainty-gated ensemble MPPI on GPU: adaptive-compute crossover and OOD-detection reliability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mujoco>=3.13.0",
    "scipy>=1.18.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
]

[project.scripts]
ua-mbrl = "ua_mbrl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ua_mbrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs CUDA (skipped otherwise)",
    "slow: trains models / runs closed-loop episodes",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
